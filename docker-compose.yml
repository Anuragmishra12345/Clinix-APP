version: "3.8"

services:
  mysql:
    image: mysql:latest
    container_name: clinix_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: MySql@123
      MYSQL_DATABASE: clinix_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - clinix-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pMySql@123"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./clinixBackend
      dockerfile: Dockerfile
    container_name: clinix_app
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/clinix_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: MySql@123
      CLINIX_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://3.24.138.69:5173
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - clinix-network

  frontend:
    build:
      context: ./ClinixFrontend/clinix-ui
      dockerfile: Dockerfile
    container_name: clinix_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - app
    networks:
      - clinix-network

networks:
  clinix-network:
    driver: bridge

volumes:
  mysql_data: